<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Fusion Avancée PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; padding: 40px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .back-link { display: inline-block; margin-bottom: 20px; color: #667eea; text-decoration: none; font-weight: bold; }
        h1 { color: #333; text-align: center; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }

        .upload-area { border: 3px dashed #667eea; border-radius: 15px; padding: 30px; text-align: center; background: #f8f9ff; cursor: pointer; margin-bottom: 30px; transition: 0.3s; }
        .upload-area:hover { background: #eef0ff; border-color: #5a67d8; }

        .groups-container { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }

        .group-box { flex: 1; min-width: 300px; background: #f8f9fa; border: 2px solid #dee2e6; border-radius: 15px; padding: 20px; }
        .group-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #dee2e6; }
        .group-title { font-weight: bold; color: #495057; font-size: 1.1em; }
        .remove-group-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.9em; }

        .group-name-input { width: 100%; padding: 10px; margin-bottom: 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 0.95em; box-sizing: border-box; }

        .file-list { min-height: 100px; }

        .file-item {
            background: white;
            border: 1px solid #ddd;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: grab;
            user-select: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .file-item:active { cursor: grabbing; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-color: #667eea; }
        .sortable-ghost { opacity: 0.4; background: #e8f5e9; border: 2px dashed #2ecc71; }

        .file-info { display: flex; align-items: center; gap: 10px; pointer-events: none; }
        .drag-icon { color: #ccc; font-size: 1.1em; }
        .file-name { font-weight: 500; color: #333; font-size: 0.9em; }

        .remove-btn { background: none; border: none; color: #ff4757; cursor: pointer; font-size: 1.1em; padding: 5px; pointer-events: auto; }
        .remove-btn:hover { color: #d63031; transform: scale(1.1); }

        .add-group-btn { background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); color: white; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-weight: 600; margin-bottom: 20px; }

        button.action-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 1.1em; cursor: pointer; font-weight: 600; }
        button:disabled { background: #ccc; cursor: not-allowed; opacity: 0.7; }

        .result-area { margin-top: 20px; }
        .result-item { background: #d4edda; border: 1px solid #c3e6cb; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .download-btn { background: #28a745; color: white; padding: 10px 20px; text-decoration: none; border-radius: 8px; font-weight: 600; }
    </style>
</head>
<body>
    <a href="/" class="back-link">← Retour Accueil</a>
    <div class="container">
        <h1>🔗 Fusion Avancée de PDF</h1>
        <p class="subtitle">Créez plusieurs groupes et fusionnez-les séparément</p>

        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <h3>Cliquez ou glissez vos PDF ici</h3>
            <p style="color:#666; font-size:0.9em;">Les fichiers seront ajoutés au Groupe 1 par défaut. Glissez-les ensuite entre les groupes.</p>
            <input type="file" id="fileInput" multiple accept=".pdf" style="display: none;">
        </div>

        <button class="add-group-btn" onclick="addNewGroup()">+ Ajouter un groupe</button>

        <div id="groupsContainer" class="groups-container"></div>

        <button id="mergeBtn" class="action-btn" disabled>Fusionner tous les groupes</button>
        <div id="result" class="result-area"></div>
    </div>

    <script>
        let uploadedFiles = [];
        let groupCount = 1;
        const groupsContainer = document.getElementById('groupsContainer');
        const fileInput = document.getElementById('fileInput');
        const mergeBtn = document.getElementById('mergeBtn');
        const uploadArea = document.querySelector('.upload-area');

        // Créer le premier groupe par défaut
        addNewGroup();

        // Drag & Drop Upload
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => uploadArea.style.background = '#eef0ff', false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => uploadArea.style.background = '#f8f9ff', false);
        });

        uploadArea.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files));
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        async function handleFiles(files) {
            if (files.length === 0) return;

            const formData = new FormData();
            let hasPdf = false;
            for(let file of files) {
                if(file.type === 'application/pdf') {
                    formData.append('files[]', file);
                    hasPdf = true;
                }
            }

            if(!hasPdf) return;

            const res = await fetch('/upload', { method: 'POST', body: formData });
            const data = await res.json();

            if(data.files) {
                uploadedFiles = [...uploadedFiles, ...data.files];
                // Ajouter au premier groupe par défaut
                const firstGroup = document.querySelector('.file-list');
                if (firstGroup) {
                    data.files.forEach(file => {
                        addFileToGroup(firstGroup, file);
                    });
                }
            }
            fileInput.value = '';
            updateMergeBtn();
        }

        function addNewGroup() {
            const groupId = `group-${groupCount}`;
            const groupDiv = document.createElement('div');
            groupDiv.className = 'group-box';
            groupDiv.dataset.groupId = groupId;

            groupDiv.innerHTML = `
                <div class="group-header">
                    <span class="group-title">📁 Groupe ${groupCount}</span>
                    <button class="remove-group-btn" onclick="removeGroup('${groupId}')">Supprimer</button>
                </div>
                <input type="text" class="group-name-input" placeholder="Nom du fichier de sortie" value="fusion_groupe_${groupCount}">
                <div class="file-list" data-group="${groupId}"></div>
            `;

            groupsContainer.appendChild(groupDiv);

            // Initialiser Sortable pour ce groupe
            const fileList = groupDiv.querySelector('.file-list');
            new Sortable(fileList, {
                group: 'shared', // Permet de déplacer entre groupes
                animation: 150,
                ghostClass: 'sortable-ghost',
                onAdd: updateMergeBtn,
                onRemove: updateMergeBtn
            });

            groupCount++;
            updateMergeBtn();
        }

        function addFileToGroup(listElement, file) {
            const item = document.createElement('div');
            item.className = 'file-item';
            item.dataset.path = file.path;
            item.innerHTML = `
                <div class="file-info">
                    <span class="drag-icon">☰</span>
                    <span class="file-name">${file.name}</span>
                </div>
                <button class="remove-btn" onclick="removeFile('${file.path}', this)">✖</button>
            `;
            listElement.appendChild(item);
        }

        window.removeFile = function(path, btnElement) {
            const item = btnElement.closest('.file-item');
            item.remove();
            uploadedFiles = uploadedFiles.filter(f => f.path !== path);
            updateMergeBtn();
            if(event) event.stopPropagation();
        }

        window.removeGroup = function(groupId) {
            const groups = document.querySelectorAll('.group-box');
            if (groups.length <= 1) {
                alert('Vous devez garder au moins un groupe !');
                return;
            }

            const group = document.querySelector(`[data-group-id="${groupId}"]`);
            if (group) {
                // Supprimer les fichiers de ce groupe de la liste
                const files = group.querySelectorAll('.file-item');
                files.forEach(file => {
                    const path = file.dataset.path;
                    uploadedFiles = uploadedFiles.filter(f => f.path !== path);
                });
                group.remove();
                updateMergeBtn();
            }
        }

        function updateMergeBtn() {
            const allFileLists = document.querySelectorAll('.file-list');
            let hasFiles = false;
            allFileLists.forEach(list => {
                if (list.querySelectorAll('.file-item').length > 0) {
                    hasFiles = true;
                }
            });
            mergeBtn.disabled = !hasFiles;
        }

        mergeBtn.addEventListener('click', async () => {
            const groups = document.querySelectorAll('.group-box');
            const groupsData = [];

            groups.forEach(groupBox => {
                const fileList = groupBox.querySelector('.file-list');
                const nameInput = groupBox.querySelector('.group-name-input');
                const files = Array.from(fileList.querySelectorAll('.file-item')).map(item => item.dataset.path);

                if (files.length > 0) {
                    groupsData.push({
                        name: nameInput.value || 'fusion',
                        files: files
                    });
                }
            });

            if (groupsData.length === 0) {
                alert('Aucun fichier à fusionner !');
                return;
            }

            mergeBtn.disabled = true;
            mergeBtn.innerText = "Fusion en cours...";
            document.getElementById('result').innerHTML = '';

            try {
                const res = await fetch('/api/merge_advanced', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ groups: groupsData })
                });

                const data = await res.json();
                if(data.success) {
                    let resultHTML = '<h3 style="color:#333; margin-bottom:15px;">✅ Fusions réussies !</h3>';
                    data.files.forEach(file => {
                        resultHTML += `
                            <div class="result-item">
                                <span>📄 ${file.displayName}</span>
                                <a href="/download/${file.filename}?name=${encodeURIComponent(file.downloadName)}" class="download-btn">
                                    ⬇️ Télécharger
                                </a>
                            </div>
                        `;
                    });
                    document.getElementById('result').innerHTML = resultHTML;
                } else {
                    alert("Erreur: " + data.error);
                }
            } catch(e) {
                alert("Erreur serveur");
            } finally {
                mergeBtn.disabled = false;
                mergeBtn.innerText = "Fusionner tous les groupes";
            }
        });
    </script>
</body>
</html>
