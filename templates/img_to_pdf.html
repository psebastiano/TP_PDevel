<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Convertir Image vers PDF</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; padding: 40px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .back-link { display: inline-block; margin-bottom: 20px; color: #667eea; text-decoration: none; font-weight: bold; }
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        .tool-description { text-align: center; color: #666; margin-bottom: 30px; font-size: 0.9em; }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }
        .upload-area:hover { background: #eef0ff; border-color: #5a67d8; }
        .upload-area.drag-over { background: #e0e7ff; border-color: #4338ca; }
        
        .icon { font-size: 3em; margin-bottom: 15px; color: #667eea; }
        
        .btn-primary {
            display: inline-block;
            background: #667eea; color: white;
            padding: 10px 20px; border-radius: 8px;
            cursor: pointer; font-weight: bold;
            margin-top: 10px;
        }

        .file-info { margin-top: 20px; text-align: center; font-weight: bold; color: #333; }
        
        button.btn-action {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 10px;
            font-size: 1.1em; cursor: pointer; font-weight: 600; margin-top: 20px;
        }
        button:disabled { background: #ccc; cursor: not-allowed; opacity: 0.7; }

        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .result-area { text-align: center; margin-top: 20px; }
        .btn-download { background: #28a745; color: white; padding: 12px 25px; text-decoration: none; border-radius: 50px; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>
    <a href="/" class="back-link">← Retour Accueil</a>

    <div class="container">
        <h1>Convertir Image vers PDF</h1>
        <p class="tool-description">Transformez vos images (PNG, JPG) en documents PDF facilement.</p>

        <div class="upload-area" id="drop-zone">
            <div class="icon"><i class="fas fa-image"></i></div>
            <h3>Glissez votre image ici</h3>
            <p>ou</p>
            <label for="file-upload" class="btn-primary">Choisir une image</label>
            <input type="file" id="file-upload" accept=".png,.jpg,.jpeg" hidden>
        </div>

        <div id="file-info" class="file-info" style="display: none;">
            <span id="filename"></span>
            <button id="convert-btn" class="btn-action">Convertir en PDF</button>
        </div>

        <div id="loader" class="loader" style="display: none;"></div>
        
        <div id="result-area" class="result-area" style="display: none;">
            <h3>Conversion terminée !</h3>
            <a id="download-link" href="#" class="btn-download">Télécharger le PDF</a>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-upload');
        const dropZone = document.getElementById('drop-zone');
        const fileInfo = document.getElementById('file-info');
        const filenameSpan = document.getElementById('filename');
        const convertBtn = document.getElementById('convert-btn');
        const loader = document.getElementById('loader');
        const resultArea = document.getElementById('result-area');
        const downloadLink = document.getElementById('download-link');

        let selectedFile = null;

        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (!file) return;
            // Vérification du type MIME
            if (!['image/jpeg', 'image/png', 'image/jpg'].includes(file.type)) {
                alert('Format non supporté. Utilisez JPG ou PNG.');
                return;
            }
            selectedFile = file;
            filenameSpan.textContent = "Image sélectionnée : " + file.name;
            fileInfo.style.display = 'block';
            resultArea.style.display = 'none';
        }

        convertBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('file', selectedFile);

            loader.style.display = 'block';
            convertBtn.disabled = true;

            try {
                const response = await fetch('/api/img_to_pdf', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    downloadLink.href = `/download/${data.filename}?name=${encodeURIComponent(data.downloadName)}`;
                    resultArea.style.display = 'block';
                } else {
                    alert('Erreur: ' + (data.error || 'Inconnue'));
                }
            } catch (error) {
                console.error(error);
                alert('Une erreur est survenue.');
            } finally {
                loader.style.display = 'none';
                convertBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
