<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>PDF vers JPEG</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; padding: 40px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .back-link { display: inline-block; margin-bottom: 20px; color: #667eea; text-decoration: none; font-weight: bold; }
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 0.9em; }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }
        .upload-area:hover { background: #eef0ff; border-color: #5a67d8; }

        .file-info { margin-top: 20px; text-align: center; font-weight: bold; color: #333; display:none; }

        .options-panel { margin-top: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input[type="text"] { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1em; box-sizing: border-box; }

        button.action-btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 10px;
            font-size: 1.1em; cursor: pointer; font-weight: 600; margin-top: 20px;
        }
        button:disabled { background: #ccc; cursor: not-allowed; opacity: 0.7; }

        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .download-zone { text-align: center; margin-top: 20px; display: none; }
        .download-link { background: #28a745; color: white; padding: 12px 25px; text-decoration: none; border-radius: 50px; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>
    <a href="/" class="back-link">← Retour Accueil</a>

    <div class="container">
        <h1>🖼️ PDF vers JPEG</h1>
        <p class="subtitle">Convertit chaque page en image (Archive ZIP)</p>
        <p style="text-align:center; color:#e74c3c; font-size:0.8em;">⚠️ Limité aux 30 premières pages</p>

        <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <span style="font-size: 3em;">📂</span>
            <h3>Cliquez ou glissez votre PDF ici</h3>
            <input type="file" id="fileInput" accept=".pdf" style="display: none;">
        </div>

        <div id="fileInfo" class="file-info"></div>

        <div class="options-panel">
            <label>Nom du fichier ZIP final :</label>
            <input type="text" id="outputName" placeholder="images_extraites">

            <button id="processBtn" class="action-btn" disabled onclick="processConversion()">Convertir en Images</button>
        </div>

        <div id="loader" class="loader"></div>
        <div id="result" class="download-zone"></div>
    </div>

    <script>
        let currentFile = null;
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const fileInfo = document.getElementById('fileInfo');

        // Drag & Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
        });
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.style.background = '#e0e7ff', false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.style.background = '#f8f9ff', false);
        });

        dropZone.addEventListener('drop', (e) => handleFile(e.dataTransfer.files[0]));
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        function handleFile(file) {
            if (!file || file.type !== 'application/pdf') {
                alert("Fichier PDF requis.");
                return;
            }
            currentFile = file;
            fileInfo.style.display = 'block';
            fileInfo.innerText = `📄 ${file.name}`;
            processBtn.disabled = false;

            // Pré-remplir le nom
            let baseName = file.name.replace('.pdf', '');
            document.getElementById('outputName').value = baseName + '_images';
        }

        async function processConversion() {
            if (!currentFile) return;

            const outputName = document.getElementById('outputName').value;
            const loader = document.getElementById('loader');
            const resultDiv = document.getElementById('result');

            processBtn.disabled = true;
            processBtn.innerText = "Conversion en cours (patience)...";
            loader.style.display = 'block';
            resultDiv.style.display = 'none';

            const formData = new FormData();
            formData.append('file', currentFile);
            formData.append('outputName', outputName);

            try {
                const res = await fetch('/api/pdf_to_jpeg', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.success) {
                    resultDiv.innerHTML = `
                        <p style="color:green; margin-bottom:10px;">✅ ${data.image_count} pages converties !</p>
                        <a href="/download/${data.filename}?name=${encodeURIComponent(data.downloadName)}" class="download-link">
                            ⬇️ Télécharger le ZIP
                        </a>
                    `;
                    resultDiv.style.display = 'block';
                    processBtn.style.display = 'none';
                } else {
                    alert('Erreur: ' + data.error);
                    processBtn.disabled = false;
                    processBtn.innerText = "Convertir en Images";
                }
            } catch (e) {
                console.error(e);
                alert('Erreur serveur');
                processBtn.disabled = false;
                processBtn.innerText = "Convertir en Images";
            } finally {
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
