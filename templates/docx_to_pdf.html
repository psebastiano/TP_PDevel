<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Convertir Word en PDF</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; padding: 40px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .back-link { display: inline-block; margin-bottom: 20px; color: #667eea; text-decoration: none; font-weight: bold; }
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 0.9em; }

        /* Zone d'upload bleue (style Word) */
        .upload-area {
            border: 3px dashed #2b579a;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: #eef4fb;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }
        .upload-area:hover { background: #dcebfd; border-color: #1e3f72; }

        .file-info { margin-top: 20px; text-align: center; font-weight: bold; color: #333; display:none; }

        button.action-btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #2b579a 0%, #3c73c4 100%);
            color: white; border: none; border-radius: 10px;
            font-size: 1.1em; cursor: pointer; font-weight: 600; margin-top: 20px;
        }
        button:disabled { background: #ccc; cursor: not-allowed; opacity: 0.7; }

        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #2b579a; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .download-zone { text-align: center; margin-top: 20px; display: none; }
        .download-link { background: #28a745; color: white; padding: 12px 25px; text-decoration: none; border-radius: 50px; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>
    <a href="/" class="back-link">← Retour Accueil</a>

    <div class="container">
        <h1>📝 Word vers PDF</h1>
        <p class="subtitle">Convertissez vos fichiers DOCX en PDF en conservant la mise en page.</p>

        <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <span style="font-size: 3em;">📘</span>
            <h3>Cliquez ou glissez votre DOCX ici</h3>
            <input type="file" id="fileInput" accept=".docx,.doc" style="display: none;">
        </div>

        <div id="fileInfo" class="file-info"></div>

        <button id="processBtn" class="action-btn" disabled onclick="processConversion()">Convertir le document</button>

        <div id="loader" class="loader"></div>
        <div id="result" class="download-zone"></div>
    </div>

    <script>
        let currentFile = null;
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const fileInfo = document.getElementById('fileInfo');
        const loader = document.getElementById('loader');
        const resultDiv = document.getElementById('result');

        // Gestion Drag & Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
        });

        dropZone.addEventListener('dragenter', () => dropZone.style.background = '#dcebfd');
        dropZone.addEventListener('dragleave', () => dropZone.style.background = '#eef4fb');

        dropZone.addEventListener('drop', (e) => handleFile(e.dataTransfer.files[0]));
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        function handleFile(file) {
            if (!file) return;
            // Vérification basique de l'extension
            const name = file.name.toLowerCase();
            if (!name.endsWith('.docx') && !name.endsWith('.doc')) {
                alert("Veuillez sélectionner un fichier Word (.docx ou .doc).");
                return;
            }

            currentFile = file;
            fileInfo.style.display = 'block';
            fileInfo.innerText = `📄 Fichier prêt : ${file.name}`;
            processBtn.disabled = false;
            resultDiv.style.display = 'none';
        }

        async function processConversion() {
            if (!currentFile) return;

            processBtn.disabled = true;
            processBtn.innerText = "Conversion en cours (cela peut prendre quelques secondes)...";
            loader.style.display = 'block';
            resultDiv.style.display = 'none';

            const formData = new FormData();
            formData.append('file', currentFile);

            try {
                const res = await fetch('/api/docx_to_pdf', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.success) {
                    resultDiv.innerHTML = `
                        <p style="color:green; font-weight:bold; margin-bottom:10px;">✅ Conversion terminée !</p>
                        <a href="/download/${data.filename}?name=${encodeURIComponent(data.downloadName)}" class="download-link">
                            ⬇️ Télécharger le PDF
                        </a>
                    `;
                    resultDiv.style.display = 'block';
                    processBtn.style.display = 'none';
                } else {
                    alert('Erreur: ' + data.error);
                    processBtn.disabled = false;
                    processBtn.innerText = "Convertir le document";
                }
            } catch (e) {
                console.error(e);
                alert('Erreur de connexion au serveur.');
                processBtn.disabled = false;
                processBtn.innerText = "Convertir le document";
            } finally {
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
