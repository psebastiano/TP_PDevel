<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Pipeline PDF - Drawflow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* BARRE LATÉRALE */
        .sidebar {
            width: 250px; background: #f8f9fa; border-right: 1px solid #ddd;
            display: flex; flex-direction: column; padding: 20px; z-index: 10;
        }

        /* BOUTON RETOUR ACCUEIL (NOUVEAU) */
        .btn-back-home {
            display: flex; align-items: center; gap: 10px;
            background: #e9ecef; color: #495057; text-decoration: none;
            padding: 12px; border-radius: 8px; font-weight: bold; font-size: 0.95rem;
            margin-bottom: 20px; transition: 0.2s; border: 1px solid #dee2e6;
        }
        .btn-back-home:hover { background: #dee2e6; color: #212529; border-color: #ced4da; }
        .btn-back-home i { font-size: 1.1rem; }

        .drag-item {
            background: white; border: 1px solid #ddd; padding: 15px; margin-bottom: 10px;
            border-radius: 8px; cursor: grab; display: flex; align-items: center; gap: 10px; transition: 0.2s;
        }
        .drag-item:hover { transform: translateX(3px); border-color: #667eea; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        /* ZONE PRINCIPALE */
        .wrapper { flex: 1; position: relative; }
        #drawflow { width: 100%; height: 100%; background: #f0f2f5; background-size: 25px 25px; background-image: radial-gradient(#d1d5db 1px, transparent 1px); }

        /* DRAWFLOW NODES */
        .drawflow .drawflow-node { background: white; width: 160px; padding: 0; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .drawflow .drawflow-node.selected { border: 2px solid #667eea; }
        .node-header { padding: 10px; border-radius: 8px 8px 0 0; color: white; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .node-body { padding: 15px; }
        .node-body input, .node-body select { width: 100%; box-sizing: border-box; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; padding: 4px; }

        /* Couleurs */
        .header-rotate { background: #f1c40f; } .header-split { background: #e74c3c; }
        .header-protect { background: #34495e; } .header-watermark { background: #9b59b6; }
        .header-convert { background: #3498db; } .header-sign { background: #e67e22; }

        /* Ports */
        .drawflow .drawflow-node .input, .drawflow .drawflow-node .output { width: 15px; height: 15px; background: #9ca3af; border: 2px solid white; }
        .drawflow .drawflow-node .input:hover, .drawflow .drawflow-node .output:hover { background: #667eea; }

        /* Contrôles bas */
        .controls { position: absolute; bottom: 30px; right: 30px; display: flex; gap: 15px; padding: 15px; background: white; border-radius: 12px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; display: flex; align-items: center; gap: 8px; }
        .btn-upload { background: #667eea; } .btn-run { background: #10b981; } .btn-clear { background: #ef4444; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }

        /* Preview Signature */
        .sig-preview { width: 100%; height: 40px; object-fit: contain; margin-top: 5px; border: 1px dashed #ccc; display:none; background: #f9f9f9; }
    </style>
</head>
<body>

<div class="sidebar">
    <a href="/" class="btn-back-home">
        <i class="fa-solid fa-arrow-left"></i> Retour Accueil
    </a>

    <h2 style="margin-top:0; font-size:1.1rem; color:#666;">🛠️ Outils</h2>

    <div class="drag-item" draggable="true" ondragstart="drag(event)" data-node="rotate"><i class="fa-solid fa-rotate" style="color:#f1c40f"></i> Rotation</div>
    <div class="drag-item" draggable="true" ondragstart="drag(event)" data-node="split"><i class="fa-solid fa-scissors" style="color:#e74c3c"></i> Diviser (Split)</div>
    <div class="drag-item" draggable="true" ondragstart="drag(event)" data-node="protect"><i class="fa-solid fa-lock" style="color:#34495e"></i> Protéger</div>
    <div class="drag-item" draggable="true" ondragstart="drag(event)" data-node="watermark"><i class="fa-solid fa-stamp" style="color:#9b59b6"></i> Filigrane</div>
    <div class="drag-item" draggable="true" ondragstart="drag(event)" data-node="sign"><i class="fa-solid fa-signature" style="color:#e67e22"></i> Signer</div>
    <div class="drag-item" draggable="true" ondragstart="drag(event)" data-node="pdf-to-docx"><i class="fa-solid fa-file-word" style="color:#3498db"></i> Vers Word</div>

    <div style="margin-top:auto; font-size:0.8rem; color:#aaa; text-align:center;">
        Glissez les blocs et reliez les points.
    </div>
</div>

<div class="wrapper">
    <div id="drawflow"></div>
    <div class="controls">
        <button class="btn btn-clear" onclick="editor.clearModuleSelected()">
            <i class="fa-solid fa-trash"></i> Vider
        </button>
        <button class="btn btn-upload" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-folder-open"></i>
            <span id="fileName">Choisir Fichier</span>
        </button>
        <input type="file" id="fileInput" hidden onchange="handleFile(this)">
        <button class="btn btn-run" id="runBtn" disabled onclick="executeFlow()">
            <i class="fa-solid fa-play"></i> Lancer
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.js"></script>
<script>
    var id = document.getElementById("drawflow");
    const editor = new Drawflow(id);
    editor.reroute = true;
    editor.start();

    let selectedFile = null;

    function drag(ev) { ev.dataTransfer.setData("node", ev.target.getAttribute('data-node')); }
    id.addEventListener('drop', (ev) => {
        ev.preventDefault();
        const type = ev.dataTransfer.getData("node");
        addNodeToDrawflow(type, ev.clientX, ev.clientY);
    });
    id.addEventListener('dragover', (ev) => ev.preventDefault());

    // Gestion de l'upload d'image de signature dans le bloc
    window.handleSignatureUpload = function(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const parent = input.parentElement;
                const hiddenInput = parent.querySelector('input[df-fileData]');
                const preview = parent.querySelector('.sig-preview');
                hiddenInput.value = e.target.result;
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function addNodeToDrawflow(type, posx, posy) {
        if(editor.editor_mode === 'fixed') return false;
        posx = posx * (editor.precanvas.clientWidth / (editor.precanvas.clientWidth * editor.zoom)) - (editor.precanvas.getBoundingClientRect().x * (editor.precanvas.clientWidth / (editor.precanvas.clientWidth * editor.zoom)));
        posy = posy * (editor.precanvas.clientHeight / (editor.precanvas.clientHeight * editor.zoom)) - (editor.precanvas.getBoundingClientRect().y * (editor.precanvas.clientHeight / (editor.precanvas.clientHeight * editor.zoom)));

        let html = "", hClass = "", inputs = 1, outputs = 1;

        if(type === 'rotate') {
            hClass = "header-rotate";
            html = `<div class="node-header ${hClass}"><i class="fa-solid fa-rotate"></i> Rotate</div><div class="node-body"><label>Angle:</label><input type="number" df-angle value="90"></div>`;
        } else if (type === 'split') {
            hClass = "header-split"; outputs = 2;
            html = `<div class="node-header ${hClass}"><i class="fa-solid fa-scissors"></i> Split</div><div class="node-body"><label>Page:</label><input type="number" df-splitPage value="1"><small style="display:block;margin-top:5px;color:#888;">Haut: P1 | Bas: P2</small></div>`;
        } else if (type === 'protect') {
            hClass = "header-protect";
            html = `<div class="node-header ${hClass}"><i class="fa-solid fa-lock"></i> Protect</div><div class="node-body"><input type="text" df-password placeholder="Mot de passe"></div>`;
        } else if (type === 'watermark') {
            hClass = "header-watermark";
            html = `<div class="node-header ${hClass}"><i class="fa-solid fa-stamp"></i> Watermark</div><div class="node-body"><input type="text" df-text placeholder="Texte"></div>`;
        } else if (type === 'sign') {
            hClass = "header-sign";
            html = `
            <div class="node-header ${hClass}"><i class="fa-solid fa-signature"></i> Signer</div>
            <div class="node-body">
                <label style="font-size:10px;">PNG Signature:</label>
                <input type="file" accept="image/png, image/jpeg" onchange="handleSignatureUpload(this)" style="font-size:10px;">
                <input type="hidden" df-fileData>
                <img class="sig-preview">
                <select df-position style="margin-top:5px; font-size:11px;">
                    <option value="bottom-right">Bas Droite</option>
                    <option value="bottom-left">Bas Gauche</option>
                    <option value="bottom-center">Bas Centre</option>
                </select>
            </div>`;
        } else {
            hClass = "header-convert";
            html = `<div class="node-header ${hClass}"><i class="fa-solid fa-file-word"></i> Convert</div><div class="node-body">Vers Word</div>`;
        }
        editor.addNode(type, inputs, outputs, posx, posy, hClass, {}, html);
    }

    function handleFile(input) {
        if(input.files[0]) {
            selectedFile = input.files[0];
            document.getElementById('fileName').innerText = " : " + selectedFile.name;
            document.getElementById('runBtn').disabled = false;
        }
    }

    function updateNodeDataFromInputs() {
        const nodes = document.querySelectorAll('.drawflow-node');
        nodes.forEach(nodeEl => {
            const nodeId = nodeEl.id.replace('node-', '');
            const inputs = nodeEl.querySelectorAll('input, select');
            const data = {};

            inputs.forEach(input => {
                const attr = Array.from(input.attributes).find(a => a.name.startsWith('df-'));
                if(attr) {
                    data[attr.name.replace('df-', '')] = input.value;
                }
            });
            editor.drawflow.drawflow.Home.data[nodeId].data = data;
        });
    }

    async function executeFlow() {
        updateNodeDataFromInputs();

        const exportData = editor.export();

        if(Object.keys(exportData.drawflow.Home.data).length === 0) {
            alert("Ajoutez des blocs avant de lancer !");
            return;
        }

        const btn = document.getElementById('runBtn');
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Traitement...';
        btn.disabled = true;

        const formData = new FormData();
        formData.append('file', selectedFile);
        formData.append('drawflow_data', JSON.stringify(exportData));

        try {
            const res = await fetch('/api/pipeline_drawflow', { method: 'POST', body: formData });
            const data = await res.json();

            if(data.success) {
                window.location.href = `/download/${data.filename}?name=${data.downloadName}`;
            } else {
                alert("Erreur Serveur: " + (data.error || "Inconnue"));
            }
        } catch (e) {
            console.error(e);
            alert("Erreur de connexion.");
        } finally {
            btn.innerHTML = '<i class="fa-solid fa-play"></i> Lancer';
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
