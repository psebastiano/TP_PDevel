<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Appliquer un Filigrane</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; padding: 40px; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .back-link { display: inline-block; margin-bottom: 20px; color: #667eea; text-decoration: none; font-weight: bold; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }

        .step-box { background: #f8f9fa; border: 2px dashed #ddd; padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: center; transition: 0.3s; cursor: pointer; }
        .step-box:hover { border-color: #667eea; background: #f0f4ff; }
        .step-box.active { border-color: #2ecc71; background: #e8f5e9; }

        .step-title { font-weight: bold; display: block; margin-bottom: 5px; color: #555; }
        .file-name { color: #2ecc71; font-weight: 600; font-size: 0.9em; }

        .form-group { margin-top: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input[type="text"] { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1em; box-sizing: border-box; }

        button.action-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 1.1em; cursor: pointer; font-weight: 600; margin-top: 20px; }
        button:disabled { background: #ccc; cursor: not-allowed; opacity: 0.7; }

        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .download-zone { text-align: center; margin-top: 20px; display: none; }
        .download-link { background: #28a745; color: white; padding: 12px 25px; text-decoration: none; border-radius: 50px; display: inline-block; }
    </style>
</head>
<body>
    <a href="/" class="back-link">← Retour Accueil</a>
    <div class="container">
        <h1>©️ Appliquer un Filigrane PDF</h1>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">Superposez un PDF (logo, texte) sur votre document.</p>

        <div class="step-box" onclick="document.getElementById('sourceInput').click()">
            <span class="step-title">1. Choisissez le document principal</span>
            <span id="sourceName">Cliquez pour upload</span>
            <input type="file" id="sourceInput" accept=".pdf" style="display: none;">
        </div>

        <div class="step-box" onclick="document.getElementById('watermarkInput').click()">
            <span class="step-title">2. Choisissez le fichier Filigrane (PDF)</span>
            <span id="watermarkName">Cliquez pour upload</span>
            <input type="file" id="watermarkInput" accept=".pdf" style="display: none;">
        </div>

        <div class="form-group">
            <label>Nom du fichier de sortie (Optionnel) :</label>
            <input type="text" id="outputName" placeholder="Ex: document_final_logo">
        </div>

        <button id="processBtn" class="action-btn" disabled onclick="processWatermark()">Fusionner et Appliquer</button>

        <div id="loader" class="loader"></div>
        <div id="result" class="download-zone"></div>
    </div>

    <script>
        let sourceFile = null;
        let watermarkFile = null;

        function updateUI() {
            const btn = document.getElementById('processBtn');
            if (sourceFile && watermarkFile) {
                btn.disabled = false;
                btn.innerHTML = "Appliquer le filigrane";
            } else {
                btn.disabled = true;
            }
        }

        document.getElementById('sourceInput').addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                sourceFile = e.target.files[0];
                document.getElementById('sourceName').innerText = "✅ " + sourceFile.name;
                document.getElementById('sourceName').className = "file-name";
                e.target.parentElement.classList.add('active');
                updateUI();
            }
        });

        document.getElementById('watermarkInput').addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                watermarkFile = e.target.files[0];
                document.getElementById('watermarkName').innerText = "✅ " + watermarkFile.name;
                document.getElementById('watermarkName').className = "file-name";
                e.target.parentElement.classList.add('active');
                updateUI();
            }
        });

        async function processWatermark() {
            const outputName = document.getElementById('outputName').value;
            const loader = document.getElementById('loader');
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('processBtn');

            loader.style.display = 'block';
            resultDiv.style.display = 'none';
            btn.disabled = true;

            const formData = new FormData();
            formData.append('file', sourceFile);
            formData.append('watermark_file', watermarkFile);
            formData.append('outputName', outputName);

            try {
                const res = await fetch('/api/watermark', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if(data.success) {
                    resultDiv.innerHTML = `
                        <p style="color:green; font-weight:bold;">✅ Terminé !</p>
                        <a href="/download/${data.filename}?name=${encodeURIComponent(data.downloadName)}" class="download-link">
                            ⬇️ Télécharger le résultat
                        </a>
                    `;
                    resultDiv.style.display = 'block';
                } else {
                    alert('Erreur: ' + data.error);
                }
            } catch (e) {
                alert('Erreur technique');
            } finally {
                loader.style.display = 'none';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
