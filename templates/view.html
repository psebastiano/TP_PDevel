<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Visualiseur PDF</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; padding: 20px; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        .header-nav { margin-bottom: 20px; }
        .back-link { display: inline-block; color: #667eea; text-decoration: none; font-weight: bold; }

        /* Zone principale */
        .main-container { flex: 1; display: flex; flex-direction: column; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }

        /* Barre d'outils haut */
        .toolbar { padding: 15px 30px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .title { font-size: 1.2em; font-weight: bold; color: #333; }

        /* Bouton Upload */
        .upload-btn-wrapper { position: relative; overflow: hidden; display: inline-block; }
        .btn { border: 2px solid #667eea; color: #667eea; background-color: white; padding: 8px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { background-color: #667eea; color: white; }
        .upload-btn-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }

        /* Zone de visualisation */
        .viewer-area { flex: 1; background: #525659; position: relative; }

        /* Iframe pour le PDF */
        #pdfViewer { width: 100%; height: 100%; border: none; display: none; }

        /* Placeholder (message d'accueil) */
        .placeholder {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: white;
        }
        .icon { font-size: 4em; margin-bottom: 20px; display: block; opacity: 0.8; }
        h2 { margin: 0; font-weight: normal; opacity: 0.9; }

    </style>
</head>
<body>
    <div class="header-nav">
        <a href="/" class="back-link">← Retour Accueil</a>
    </div>

    <div class="main-container">
        <div class="toolbar">
            <div class="title">👁️ Visualiseur PDF</div>
            <div class="upload-btn-wrapper">
                <button class="btn">📂 Ouvrir un fichier PDF</button>
                <input type="file" id="fileInput" accept=".pdf">
            </div>
        </div>

        <div class="viewer-area" id="dropZone">
            <div id="placeholder" class="placeholder">
                <span class="icon">📄</span>
                <h2>Glissez un fichier ici ou cliquez sur "Ouvrir"</h2>
            </div>
            <iframe id="pdfViewer" type="application/pdf"></iframe>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const pdfViewer = document.getElementById('pdfViewer');
        const placeholder = document.getElementById('placeholder');
        const dropZone = document.getElementById('dropZone');

        // Fonction pour afficher le PDF
        function showPDF(file) {
            if (!file || file.type !== 'application/pdf') {
                alert("Veuillez sélectionner un fichier PDF valide.");
                return;
            }

            // Création d'une URL locale temporaire (Blob URL)
            const objectUrl = URL.createObjectURL(file);

            // Affichage
            placeholder.style.display = 'none';
            pdfViewer.style.display = 'block';
            pdfViewer.src = objectUrl;
        }

        // Événement : Sélection via bouton
        fileInput.addEventListener('change', (e) => showPDF(e.target.files[0]));

        // Événement : Drag & Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
        });

        dropZone.addEventListener('drop', (e) => showPDF(e.dataTransfer.files[0]));
    </script>
</body>
</html>
